<!-- ============ AGENDAMENTOS ============ -->
<div class="card">
  <div class="bloco-barra">
    <span class="ag-live" id="ag-live" title="Atualiza sozinho"><span class="ag-live-dot"></span>ao vivo</span>
    <span class="tag" id="ag-count">{{ agendamentos|length }} marcado{{ '' if agendamentos|length == 1 else 's' }}</span>
    <button type="button" class="btn-acento btn-sm card-acao" id="ag-novo-abrir">+ Novo agendamento</button>
  </div>
  <div class="tbl-rolagem">
  <table class="tbl">
    <thead><tr><th>#</th><th>Cliente</th><th>Serviço</th><th>Quando</th><th></th></tr></thead>
    <!-- As linhas vivem em partials/agendamentos_linhas.html: o mesmo trecho é
         renderizado de novo por /admin/agendamentos/estado quando o painel
         repinta a tabela sozinho (js/agendamentos.js). -->
    <tbody id="ag-tbody">{% include "partials/agendamentos_linhas.html" %}</tbody>
  </table>
  </div>
</div>

<!-- Modal "Novo agendamento": realocado pro body via JS (mesmo padrão do de conversas). -->
<div class="agm-modal" id="agm-modal" role="dialog" aria-modal="true" aria-labelledby="agm-titulo">
  <div class="agm-backdrop" data-fechar></div>
  <div class="agm-card" data-accent="marca">
    <header class="agm-head">
      <h2 class="agm-titulo" id="agm-titulo">Novo agendamento</h2>
      <button type="button" class="agm-x" id="agm-x" aria-label="Fechar">✕</button>
    </header>
    <form class="agm-body" id="agm-form" action="/admin/agendamento" data-nativo autocomplete="off">
      <div class="row">
        <div><label>Cliente</label><input name="nome_cliente" required placeholder="Nome — busca quem já é cliente"></div>
        <div>
          <label>Telefone (WhatsApp)</label>
          <input name="telefone_cliente" required placeholder="+55 (45) 99999-9999" data-telefone inputmode="tel">
        </div>
      </div>
      <div class="row">
        <div><label>Serviço</label>
          <select name="servico_id" id="agm-servico" required>
            {% for s in servicos if s.ativo %}
            <option value="{{ s.id }}">{{ s.nome }} ({{ s.duracao_min }}min)</option>
            {% else %}
            <option value="" disabled>Nenhum serviço ativo — cadastre no catálogo</option>
            {% endfor %}
          </select>
        </div>
        <div><label>Data</label><input id="agm-data" type="date" required></div>
      </div>

      <label>Horário</label>
      <div class="agm-slots" id="agm-slots" aria-live="polite">
        <p class="agm-slots-dica">Escolha o serviço e a data para ver os horários.</p>
      </div>
      <div class="agm-legenda" id="agm-legenda" hidden>
        <span class="agm-leg-item"><span class="agm-leg-quad livre"></span>Livre</span>
        <span class="agm-leg-item"><span class="agm-leg-quad ocupado"></span>Ocupado</span>
      </div>
      <input type="hidden" name="inicio" id="agm-inicio">

      <label>Observações <span style="text-transform:none;font-weight:400">(opcional)</span></label>
      <input name="observacoes" placeholder="Detalhes do cliente">

      <!-- Ficha de cadastro (só com a feature ligada): campos montados por
           js/ficha.js, já preenchidos com o que o contato tinha. -->
      <div class="agm-ficha" id="agm-ficha" hidden>
        <p class="agm-ficha-nota" id="agm-ficha-nota"></p>
        <div id="agm-ficha-campos"></div>
      </div>

      <div class="agm-acoes">
        <button type="button" class="btn-ghost btn-sm" id="agm-cancelar">Cancelar</button>
        <button type="submit" class="btn-primary btn-sm" id="agm-salvar">Agendar</button>
      </div>
    </form>
  </div>
</div>
