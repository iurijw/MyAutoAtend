<!-- ============ CONFIGURAÇÃO ============ -->
<div class="card" id="config-card">
  <div class="card-head"><h2>Configuração geral</h2></div>
  <form method="post" action="/admin/config" id="config-body">
    <div class="row">
      <div><label>Telefone do dono <span style="text-transform:none;font-weight:400">(autoriza ações restritas)</span></label><input name="telefone_dono" value="{{ config.telefone_dono }}" data-telefone inputmode="tel"></div>
      <div><label>Fuso horário</label><input name="fuso" value="{{ config.fuso }}"></div>
    </div>
    <label class="check-linha">
      <input type="checkbox" name="avisar_dono" value="true" {% if config.avisar_dono %}checked{% endif %}>
      Avisar o dono no WhatsApp sobre agendamentos, reagendamentos e cancelamentos feitos pelo bot
    </label>
    <button class="btn-acento">Salvar configuração</button>
  </form>
</div>
